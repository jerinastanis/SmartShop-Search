spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

app:
  embedding:
    text-endpoint: ${EMBEDDING_TEXT_ENDPOINT}
    text-timeout-seconds: ${EMBEDDING_TEXT_TIMEOUT:60}
    text-max-length: ${EMBEDDING_TEXT_MAX_LENGTH:512}
    image-endpoint: ${EMBEDDING_IMAGE_ENDPOINT}
    image-timeout-seconds: ${EMBEDDING_IMAGE_TIMEOUT:60}
  
  ollama:
    endpoint: ${OLLAMA_ENDPOINT}
    model: ${OLLAMA_MODEL:mistral}
    timeout-seconds: ${OLLAMA_TIMEOUT:60}
  
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  
  data-loader:
    load-on-startup: ${DATA_LOADER_ON_STARTUP:false}
    products-file: ${PRODUCTS_FILE:data/products.json}
